[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amr-icu"
version = "1.0.0"
description = "Temporal models for Pseudomonas aeruginosa resistance in the ICU"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Àlvar Hernández-Carnerero"},
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7", "pillow>=10"]

[project.scripts]
amr-icu = "amr_icu.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
